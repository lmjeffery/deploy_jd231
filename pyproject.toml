[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lmjeffery-deploy_jd231"
version = "0.1.0"
description = "从输入中抽取数值，计算模型部署工程师·数据去重与污染检测相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "lmjeffery" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://lmjeffery.github.io"
Repository = "https://github.com/lmjeffery/deploy_jd231"
Issues = "https://github.com/lmjeffery/deploy_jd231/issues"

[project.scripts]
deploy_jd231 = "deploy_jd231:main"

[tool.setuptools]
py-modules = ["deploy_jd231"]
